# Docs: https://pnpm.io/settings
# https://github.com/emberjs/rfcs/pull/907

packages:
  - .
  - docs
  - test-types

allowBuilds:
  core-js: false
  fsevents: false

# we don't want addons to be bad citizens of the ecosystem
autoInstallPeers: false

# we want true isolation,
# if a dependency is not declared, we want an error
resolvePeersFromWorkspaceRoot: false

# @embroider/macros@1.21.2 was published without its build output.
# Keep transitive ranges (e.g. from ember-auto-import) off of it.
overrides:
  '@embroider/macros': '^1.21.3'
